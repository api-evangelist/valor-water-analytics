  and revenue-loss detection. A Y Combinator, Imagine H2O, and 500 Global portfolio
  company, it was acquired by Xylem Inc. (completed February 2, 2018) and folded into
  Xylem's digital portfolio, now represented by the Xylem Vue platform. valorwater.com
  redirects to Xylem Vue, and no independent API surface remains published.
